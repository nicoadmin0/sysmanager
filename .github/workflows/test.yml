name: Test auf macOS

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Script ausfuehren
        run: |
          chmod +x bash.sh
          echo "admin" | timeout 10 bash bash.sh || true
